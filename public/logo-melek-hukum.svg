<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#92400e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Law scale symbol -->
  <g transform="translate(10, 15)">
    <!-- Scale base -->
    <rect x="22" y="45" width="6" height="8" fill="url(#logoGrad)" rx="3"/>
    
    <!-- Scale pole -->
    <rect x="24" y="15" width="2" height="35" fill="url(#logoGrad)"/>
    
    <!-- Scale beam -->
    <rect x="10" y="15" width="28" height="2" fill="url(#logoGrad)" rx="1"/>
    
    <!-- Left pan -->
    <path d="M8 17 L18 17 L16 25 L10 25 Z" fill="url(#logoGrad)" opacity="0.8"/>
    <path d="M6 17 L20 17" stroke="url(#logoGrad)" stroke-width="1" fill="none"/>
    
    <!-- Right pan -->
    <path d="M30 17 L40 17 L38 25 L32 25 Z" fill="url(#logoGrad)" opacity="0.8"/>
    <path d="M28 17 L42 17" stroke="url(#logoGrad)" stroke-width="1" fill="none"/>
    
    <!-- Chains -->
    <path d="M14 17 L14 19" stroke="url(#logoGrad)" stroke-width="1"/>
    <path d="M34 17 L34 19" stroke="url(#logoGrad)" stroke-width="1"/>
  </g>
  
  <!-- Text -->
  <text x="65" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="url(#logoGrad)">
    MELEK
  </text>
  <text x="65" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="url(#logoGrad)">
    HUKUM
  </text>
  <text x="65" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="400" fill="#666" opacity="0.8">
    Portal Hukum Indonesia
  </text>
</svg> 