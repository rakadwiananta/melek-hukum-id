<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#92400e;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  
  <!-- Background circles -->
  <circle cx="100" cy="100" r="80" fill="url(#grad1)" opacity="0.3"/>
  <circle cx="900" cy="150" r="120" fill="url(#grad1)" opacity="0.2"/>
  <circle cx="200" cy="400" r="60" fill="url(#grad1)" opacity="0.4"/>
  <circle cx="1000" cy="450" r="90" fill="url(#grad1)" opacity="0.3"/>
  
  <!-- Legal symbols scattered -->
  <g transform="translate(150, 200)" opacity="0.1">
