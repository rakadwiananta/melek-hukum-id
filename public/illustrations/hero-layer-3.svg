<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c2d12;stop-opacity:0.06" />
      <stop offset="100%" style="stop-color:#451a03;stop-opacity:0.03" />
    </linearGradient>
  </defs>
  
  <!-- Geometric patterns -->
  <g transform="translate(200, 100)" opacity="0.05">
    <!-- Hexagonal pattern -->
    <polygon points="20,5 35,13 35,27 20,35 5,27 5,13" fill="none" stroke="#7c2d12" stroke-width="0.5"/>
    <polygon points="20,12 28,16 28,24 20,28 12,24 12,16" fill="#7c2d12" opacity="0.3"/>
  </g>
  
  <g transform="translate(600, 450)" opacity="0.04">
    <!-- Abstract legal symbol -->
    <rect x="0" y="15" width="25" height="2" fill="#7c2d12" rx="1"/>
    <rect x="12" y="0" width="2" height="30" fill="#7c2d12" rx="1"/>
    <circle cx="8" cy="16" r="3" fill="none" stroke="#7c2d12" stroke-width="0.5"/>
    <circle cx="18" cy="16" r="3" fill="none" stroke="#7c2d12" stroke-width="0.5"/>
  </g>
  
  <g transform="translate(900, 180)" opacity="0.03">
    <!-- Indonesian diamond pattern -->
    <polygon points="15,0 30,15 15,30 0,15" fill="none" stroke="#7c2d12" stroke-width="0.5"/>
    <polygon points="15,7 23,15 15,23 7,15" fill="#7c2d12" opacity="0.2"/>
  </g>
  
  <g transform="translate(100, 350)" opacity="0.04">
    <!-- Traditional scroll -->
    <path d="M0 10 Q0 0 10 0 L30 0 Q40 0 40 10 L40 20 Q40 30 30 30 L10 30 Q0 30 0 20 Z" fill="#7c2d12" opacity="0.2"/>
    <line x1="8" y1="10" x2="32" y2="10" stroke="#451a03" stroke-width="0.3"/>
    <line x1="8" y1="15" x2="28" y2="15" stroke="#451a03" stroke-width="0.3"/>
    <line x1="8" y1="20" x2="30" y2="20" stroke="#451a03" stroke-width="0.3"/>
  </g>
  
  <!-- Scattered dots for texture -->
  <circle cx="150" cy="50" r="1" fill="#7c2d12" opacity="0.1"/>
  <circle cx="350" cy="150" r="1" fill="#7c2d12" opacity="0.08"/>
  <circle cx="550" cy="250" r="1" fill="#7c2d12" opacity="0.1"/>
  <circle cx="750" cy="350" r="1" fill="#7c2d12" opacity="0.06"/>
  <circle cx="950" cy="450" r="1" fill="#7c2d12" opacity="0.09"/>
  <circle cx="1050" cy="100" r="1" fill="#7c2d12" opacity="0.07"/>
</svg> 