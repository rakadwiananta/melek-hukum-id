# Netlify configuration for Wacana Hukum
# This file configures the build and deployment settings

[build]
  # Build command
  command = "npm run build"
  
  # Publish directory
  publish = ".next"
  
  # Node.js version
  [build.environment]
    NODE_VERSION = "18"
    NPM_VERSION = "9"

# Redirects configuration
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers configuration
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache configuration for static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Environment variables untuk auto deploy
[context.production.environment]
  NODE_ENV = "production"
  NEXT_PUBLIC_SITE_NAME = "Wacana Hukum"
  NEXT_PUBLIC_SITE_URL = "https://wacanahukum.com"
