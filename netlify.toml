[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"
  # Secrets scanning configuration - omit build artifacts and known safe keys
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_GA_MEASUREMENT_ID,NEXT_PUBLIC_MIDTRANS_CLIENT_KEY,MIDTRANS_FIXED_PRICE"
  SECRETS_SCAN_OMIT_PATHS = ".next/**,.netlify/**,node_modules/**,*.trace,**/*.trace,build/**,dist/**"
  # Disable secrets scanning for build artifacts
  SECRETS_SCAN_ENABLED = "false"

# Plugin untuk Next.js
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Force HTTPS redirects
[[redirects]]
  from = "http://wacanahukum.com/*"
  to = "https://wacanahukum.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.wacanahukum.com/*"
  to = "https://wacanahukum.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.wacanahukum.com/*"
  to = "https://wacanahukum.com/:splat"
  status = 301
  force = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Cache headers for static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# No cache for HTML files
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# API routes no cache
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# Sitemap and robots.txt headers
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600, must-revalidate"

# Auto deploy configuration
[build.processing]
  skip_processing = false

# Environment variables untuk auto deploy
[context.production.environment]
  NODE_ENV = "production"
  NEXT_PUBLIC_SITE_NAME = "Melek Hukum"
  NEXT_PUBLIC_SITE_URL = "https://wacanahukum.com"
  NEXT_PUBLIC_BASE_URL = "https://wacanahukum.com"
  NEXT_PUBLIC_GA_MEASUREMENT_ID = "G-D5EH0QKDSF"
  NEXT_PUBLIC_FORCE_HTTPS = "true"
  NEXT_PUBLIC_SECURE_COOKIES = "true"

[context.deploy-preview.environment]
  NODE_ENV = "production"
  NEXT_PUBLIC_SITE_NAME = "Melek Hukum"
  NEXT_PUBLIC_SITE_URL = "https://wacanahukum.com"
  NEXT_PUBLIC_BASE_URL = "https://wacanahukum.com"
  NEXT_PUBLIC_GA_MEASUREMENT_ID = "G-D5EH0QKDSF"
  NEXT_PUBLIC_FORCE_HTTPS = "true"
  NEXT_PUBLIC_SECURE_COOKIES = "true"

[context.branch-deploy.environment]
  NODE_ENV = "production"
  NEXT_PUBLIC_SITE_NAME = "Melek Hukum"
  NEXT_PUBLIC_SITE_URL = "https://wacanahukum.com"
  NEXT_PUBLIC_BASE_URL = "https://wacanahukum.com"
  NEXT_PUBLIC_GA_MEASUREMENT_ID = "G-D5EH0QKDSF"
  NEXT_PUBLIC_FORCE_HTTPS = "true"
  NEXT_PUBLIC_SECURE_COOKIES = "true" 