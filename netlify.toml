[build]
  command = "npm install --include=dev && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NODE_ENV = "production"
  # Secrets scanning konfigurasi: abaikan kunci publik dan artefak build
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_GA_MEASUREMENT_ID,NEXT_PUBLIC_MIDTRANS_CLIENT_KEY"
  SECRETS_SCAN_OMIT_PATHS = ".next/**,.netlify/**,node_modules/**"

# Plugin untuk Next.js
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Konfigurasi domain
[context.production]
  domain = "bicarahukum.my.id"

# Redirect untuk www subdomain
[[redirects]]
  from = "https://www.bicarahukum.my.id/*"
  to = "https://bicarahukum.my.id/:splat"
  status = 301
  force = true

# Redirect untuk HTTP ke HTTPS
[[redirects]]
  from = "http://bicarahukum.my.id/*"
  to = "https://bicarahukum.my.id/:splat"
  status = 301
  force = true

# Headers untuk keamanan
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache headers untuk aset statis
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/image*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Auto deploy configuration
[build.processing]
  skip_processing = false

# Environment variables untuk auto deploy
[context.production.environment]
  NODE_ENV = "production"
  NEXT_PUBLIC_SITE_NAME = "Melek Hukum ID"
  NEXT_PUBLIC_SITE_URL = "https://bicarahukum.my.id"
  NEXT_PUBLIC_BASE_URL = "https://bicarahukum.my.id"
  NEXT_PUBLIC_GA_MEASUREMENT_ID = "G-D5EH0QKDSF" 